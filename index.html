<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my website</title>
  </head>
  <body>
    <h1>Бүртгэл үүсгэх</h1>
    <h2>Шинэ хэрэглэгч</h2>

    <hr />

    <div>
      <p>Манай сайтад бүртгүүлэхийн тулд доорх мэдээллийг бөглөнө үү.</p>

      <form>
        <label>Нэр:</label>
        <input type="text" placeholder="Нэрээ оруулна уу" />
        <br /><br />

        <label>Овог:</label>
        <input type="text" placeholder="Овгоо оруулна уу" />
        <br /><br />

        <label>И-мэйл:</label>
        <input type="email" placeholder="example@gmail.com" />
        <br /><br />

        <label>Нууц үг:</label>
        <input type="password" placeholder="Нууц үгээ оруулна уу" />
        <br /><br />

        <label>Төрсөн огноо:</label>
        <input type="date" />
        <br /><br />

        <label>Хүйс:</label>
        <input type="radio" name="gender" /> Эрэгтэй
        <input type="radio" name="gender" /> Эмэгтэй <br /><br />

        <label>Сонирхол:</label>
        <ul>
          <li><input type="checkbox" /> Спорт</li>
          <li><input type="checkbox" /> Хөгжим</li>
          <li><input type="checkbox" /> Компьютер</li>
        </ul>

        <label>Утасны дугаар:</label>
        <input type="tel" placeholder="99247247" />
        <br /><br />

        <label>Өөрийн тухай:</label>
        <br />
        <textarea
          rows="5"
          cols="40"
          placeholder="Өөрийнхөө тухай бичнэ үү"
        ></textarea>
        <br /><br />

        <button type="">Бүртгүүлэх</button>
        <button type="reset">Цэвэрлэх</button>
      </form>
    </div>

    <hr />

    <h3>Холбоос</h3>
    <p>
      Нүүр хуудас руу
      <a href="https://www.google.com">энд дарна уу</a>
    </p>

    <img src="https://picture alt="Бүртгэлийн зураг" />

    <h4>Анхааруулга</h4>
    <p><span>Таны оруулсан мэдээллийг</span> зөв бөглөнө үү.</p>

    <h5>Бүртгэл</h5>
    <h6>© 2026</h6>
  </body>
</html>
